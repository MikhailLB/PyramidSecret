name: pyramid_secret
description: "Pyramid Secret — Egyptian themed minesweeper game."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─── Storage ───
  shared_preferences: 2.5.2
  flutter_secure_storage: 9.2.4

  # ─── Networking ───
  http: 1.2.2
  connectivity_plus: 6.1.3

  # ─── Device info / launcher ───
  device_info_plus: 11.3.0
  package_info_plus: 8.2.1
  url_launcher: 6.3.0

  # ─── Media ───
  webview_flutter: 4.10.0
  webview_flutter_android: 4.4.0
  video_player: 2.9.2

  # ─── Attribution ───
  appsflyer_sdk: 6.15.2

  # ─── Push / Firebase ───
  firebase_core: 3.15.0
  firebase_messaging: 15.2.3
  firebase_app_check: 0.3.2+8
  flutter_local_notifications: 17.2.4

  # ─── Files (WebView upload). Locked to 8.x per gray_part_pitfalls §1. ───
  file_picker: 8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: false
  adaptive_icon_background: "#2E0A57"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/Notifications/
    - assets/Nowifi/
